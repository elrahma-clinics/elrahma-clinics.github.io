<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Clinic logo</title>
  <defs>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BE53F"/>
      <stop offset="1" stop-color="#7FB93E"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7981F"/>
      <stop offset="1" stop-color="#F26122"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DC8F2"/>
      <stop offset="1" stop-color="#1F86D6"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D00000"/>
      <stop offset="1" stop-color="#FF0A0A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <path id="figure" d="M200,200 C170,170 135,115 130,70 C128,48 150,40 160,58 C172,78 186,95 198,106 C220,90 275,35 296,12 C308,0 322,8 316,30 C300,90 245,155 200,200 Z"/>
    <circle id="head" cx="202" cy="66" r="14"/>
  </defs>

  <g filter="url(#shadow)">
    <g transform="rotate(270 200 200)">
      <use href="#figure" fill="url(#gRed)"/>
      <use href="#head" fill="url(#gRed)"/>
    </g>
    <g transform="rotate(180 200 200)">
      <use href="#figure" fill="url(#gBlue)"/>
      <use href="#head" fill="url(#gBlue)"/>
    </g>
    <g transform="rotate(90 200 200)">
      <use href="#figure" fill="url(#gOrange)"/>
      <use href="#head" fill="url(#gOrange)"/>
    </g>
    <g>
      <use href="#figure" fill="url(#gGreen)"/>
      <use href="#head" fill="url(#gGreen)"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
